# Summarise a file in sixty words, and mean it.
#
#   start: read_target ──> draft ──gate: word_limit──> (output)
#
# `draft` is an ordinary agent step with one extra key. Its `gate` names a tool that has
# to accept the answer before the step pushes anywhere. Exit 0 accepts. Any other exit
# rejects, and what the tool printed comes back as `{{ gate.text }}` in the next prompt,
# appended to the original one. Each turn is a fresh session, so the prompt is the only
# place that history can live.
#
# The retry is inside the step, not in the graph. There is no edge from `draft` back to
# itself, nothing downstream can see a draft the gate rejected, and a flow still has no
# cycles in it.
#
# When the attempts run out the step fails, carrying what the gate last said. A gate is
# not a suggestion.
#
# `incident.md` ships with this project, so the example runs with nothing to prepare.
# Any file inside the workspace works: common/read_file is sandboxed to it.
#
#   atf --workspace examples/gated-summary \
#       run summarize --input path=incident.md
#
# Watch stderr. A rejected attempt prints a ⟲ line with the count it came back with, so
# an answer landing at 61 words looks different from one landing at 200.
#
# To see one rejected, drop the gate's max_words below the number the prompt asks for.
# Expect it to take every attempt and fail: the prompt is still asking for 60, and where
# the prompt and the gate disagree the prompt is what the model is writing to. Keep the
# two numbers the same and the gate catches the misses instead of arguing with the brief.

flow: summarize
version: 1
description: Summarise a file in at most sixty words, enforced by a tool rather than a prompt.

inputs:
  path:
    type: string
    required: true
    description: File to summarise, relative to the workspace root.

start: read_target

steps:
  - id: read_target
    tool: common/read_file
    input:
      path: "{{ inputs.path }}"
      max_lines: 400
    push: [draft]

  # The limit is written twice on purpose. The prompt asks for it, and the gate is what
  # holds the answer to it. Only the second one is load-bearing.
  - id: draft
    agent: brief_writer
    prompt: |
      Summarise this file in at most 60 words.

      Path: {{ inputs.path }}
      ---
      {{ steps.read_target.text }}
    gate:
      tool: word_limit
      input:
        text: "{{ this.text }}"
        max_words: 60
      max_attempts: 3
      feedback: |
        Your last answer was rejected by word_limit:

        {{ gate.text }}

        It said:

        {{ this.text }}

        Write it again, inside the limit.

output:
  template: |
    {{ steps.draft.text }}
