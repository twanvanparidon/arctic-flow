# Arctic Flow, across every project. Written by `atf init`, read by every command.
#
# Everything here is optional, and an unknown key is refused rather than ignored.
# Anything a flow should decide belongs in the flow; anything a component should
# decide belongs in its spec.json.

run:
  # A ceiling on one run, in minutes. A safeguard against a flow that never finishes,
  # not a per-flow tuning knob, so no flow can raise it. Four hours by default.
  #
  # When it fires the run fails and its tools are stopped. An agent turn already in
  # flight is bounded by its own `timeout_seconds` instead, so the real stop can be
  # one turn later than this.
  max_minutes: 240

# Extra places to look for tools, agents and flows, searched in the order listed.
# Each is a directory laid out the way this one is: tools/, agents/, flows/.
#
# They sit below this directory, so a source never replaces something you or the
# project defines, and it cannot define anything under `arctic/`, which belongs to
# the engine. A source that is not there is skipped. Absolute or ~/ only.
sources: []
#  - ~/work/arctic-components
#  - /opt/team/arctic

# Which of the tool packs that shipped with the engine are switched on.
#
# A pack is the engine's own, so unlike a source it defines names under `arctic/`
# and you can rely on `arctic/git/commit` meaning the tool that shipped. It costs
# no download: it is already in the binary, and this line is consent rather than
# installation. A pack holds tools that write, and an install nobody configured
# has none of them.
#
# `atf list` shows every pack and whether it is on. A name that is not a pack is
# refused rather than ignored, the same way an unknown key here is.
packs: []
#  - git      # status, log, diff, show, branch, add, commit, checkout
