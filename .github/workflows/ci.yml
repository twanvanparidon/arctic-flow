# Lint and test in parallel, then build from the same Dockerfile used locally. One build
# recipe, so a green run means your machine produces the same artefact.

name: CI

# A bare branch push runs nothing. Code is checked on the pull request that proposes it, and
# a version tag is what publishes.
#
# A release is a version or a candidate for one, so those are the only two tags. A tag
# matching neither starts no run at all, which looks like a pipeline that is down, so
# TestVersion carries the same two shapes and fails on the pull request instead.
on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

# A new commit on a pull request cancels the run for the one before it. A tag is pushed once,
# so a release is never the run that gets cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # The lint extra, so ruff is available. The package itself, so `atf` is.
      - run: pip install --quiet ".[lint]"

      - run: ruff check src packaging tests
      - run: ruff format --check src packaging tests

      # shellcheck matters as much as ruff here: the tools and adapters this engine runs are
      # shell scripts. dist/, build/ and var/ are gitignored so absent in CI, and excluded
      # anyway so running this locally checks the same set. shellcheck ships with the runner.
      - run: shellcheck $(find . -name '*.sh' -not -path './dist/*' -not -path './build/*' -not -path './var/*')

      # Cycles, unreachable steps, template references, secrets templated into an agent
      # prompt. Each flow is linted with its own project as workspace.
      - name: Lint every example flow
        run: |
          for flow in examples/*/flows/*.yaml; do
            project=$(dirname "$(dirname "$flow")")
            atf --workspace "$project" lint "$(basename "$flow" .yaml)"
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # Editable, so coverage measures src/ rather than a copy of it in site-packages, and
      # so `atf` on PATH is this checkout.
      - run: pip install --quiet -e ".[test]"

      # Two steps rather than two jobs. At twenty seconds of tests a second job would spend
      # more on checkout and install than it saved, and one coverage file needs no
      # combining. What the split buys is knowing which level broke without opening the log.
      - name: Unit
        run: coverage run -m pytest tests/unit --junitxml=reports/unit.xml

      # Runs even when the unit step failed, so there is a report for both levels either
      # way. The job is already red by then; this only decides how much is known about why.
      - name: Integration
        if: ${{ !cancelled() }}
        run: |
          coverage run --append -m pytest tests/integration \
            --junitxml=reports/integration.xml

      # Counts and coverage onto the run page itself. A failing suite is the case this
      # exists for, so it must not be skipped when a step above it failed.
      - name: Summarise
        if: ${{ !cancelled() }}
        run: |
          python packaging/junit_summary.py \
            reports/unit.xml reports/integration.xml >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "## Coverage"
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          coverage xml -o reports/coverage.xml
          coverage html -d reports/htmlcov

      # JUnit XML for anything that reads it, and the HTML report for walking a gap line by
      # line. Coverage never fails the build: it is a number to look at, not a gate.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: reports/
          retention-days: 7

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      # VCS_REF labels the image, which is the artefact's only trace back to a commit.
      # VERSION is the tag, and empty on a pull request: the binary then reports the
      # placeholder in src/cli/branding.py, which is what an untagged build is.
      - name: Build the image
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          docker build \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg VERSION="$VERSION" \
            -f packaging/Dockerfile.build \
            -t atf-build .

      - name: Extract the binary
        run: |
          docker create --name atf-out atf-build
          mkdir -p dist
          docker cp atf-out:/out/atf ./dist/
          docker rm atf-out

      # `docker build` already smoke-tested itself. This is the extracted copy, which is a
      # different thing: it is what gets published.
      - name: Smoke-test the extracted copy
        run: |
          ./dist/atf/atf --version
          ./dist/atf/atf list

      # upload-artifact zips its input and drops the executable bit, leaving the release job
      # a binary it cannot run. A tar carries the mode through.
      - name: Pack the binary for the release job
        run: tar --create --file atf-dist.tar --directory dist atf

      - uses: actions/upload-artifact@v4
        with:
          name: atf-dist
          path: atf-dist.tar
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install --quiet build

      # Downloaded rather than rebuilt: a release ships the binary that was tested, not a
      # second one that should be identical.
      - uses: actions/download-artifact@v4
        with:
          name: atf-dist

      - name: Unpack the tested binary
        run: |
          mkdir -p dist
          tar --extract --file atf-dist.tar --directory dist

      # The wheel is built here, from this checkout, rather than in the image that produced
      # the binary. So it needs the same stamp, or one release ships two versions of itself.
      # release.sh does not do this: it promises to be runnable locally, and dirtying a
      # working tree as a side effect of inspecting a release is not that.
      - name: Stamp the version onto the checkout
        run: python packaging/stamp_version.py "${{ github.ref_name }}"

      - name: Package the release
        run: packaging/release.sh --tag "${{ github.ref_name }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--title "$TAG" --generate-notes)
          if [[ $TAG == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" dist/release/*
