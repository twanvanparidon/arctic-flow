# Lint and test in parallel, then build from the same Dockerfile used locally. One build
# recipe, so a green run means your machine produces the same artefact.

name: CI

# A bare branch push runs nothing. Code is checked on the pull request that proposes it, and
# a v* tag is what publishes.
on:
  pull_request:
  push:
    tags: ['v*']

# A new commit on a pull request cancels the run for the one before it. A tag is pushed once,
# so a release is never the run that gets cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # The lint extra, so ruff is available. The package itself, so `atf` is.
      - run: pip install --quiet ".[lint]"

      - run: ruff check src packaging tests
      - run: ruff format --check src packaging tests

      # shellcheck matters as much as ruff here: the tools and adapters this engine runs are
      # shell scripts. dist/, build/ and var/ are gitignored so absent in CI, and excluded
      # anyway so running this locally checks the same set. shellcheck ships with the runner.
      - run: shellcheck $(find . -name '*.sh' -not -path './dist/*' -not -path './build/*' -not -path './var/*')

      # Cycles, unreachable steps, template references, secrets templated into an agent
      # prompt. Each flow is linted with its own project as workspace.
      - name: Lint every example flow
        run: |
          for flow in examples/*/flows/*.yaml; do
            project=$(dirname "$(dirname "$flow")")
            atf --workspace "$project" lint "$(basename "$flow" .yaml)"
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # The runtime dependencies, plus pytest from the test extra. pyproject prepends src/
      # for a test run, so what gets imported is the checkout and not the installed copy.
      - run: pip install --quiet ".[test]"

      # The unit suite spawns real subprocesses and opens real pseudo-terminals, and needs
      # nothing installed beyond a POSIX shell. tests/integration and tests/e2e are empty.
      - run: pytest

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      # VCS_REF labels the image, which is the artefact's only trace back to a commit: the
      # binary is not stamped, `atf --version` reads src/cli/branding.py.
      - name: Build the image
        run: |
          docker build \
            --build-arg VCS_REF=${{ github.sha }} \
            -f packaging/Dockerfile.build \
            -t atf-build .

      - name: Extract the binary
        run: |
          docker create --name atf-out atf-build
          mkdir -p dist
          docker cp atf-out:/out/atf ./dist/
          docker rm atf-out

      # `docker build` already smoke-tested itself. This is the extracted copy, which is a
      # different thing: it is what gets published.
      - name: Smoke-test the extracted copy
        run: |
          ./dist/atf/atf --version
          ./dist/atf/atf list

      # upload-artifact zips its input and drops the executable bit, leaving the release job
      # a binary it cannot run. A tar carries the mode through.
      - name: Pack the binary for the release job
        run: tar --create --file atf-dist.tar --directory dist atf

      - uses: actions/upload-artifact@v4
        with:
          name: atf-dist
          path: atf-dist.tar
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install --quiet build

      # Downloaded rather than rebuilt: a release ships the binary that was tested, not a
      # second one that should be identical.
      - uses: actions/download-artifact@v4
        with:
          name: atf-dist

      - name: Unpack the tested binary
        run: |
          mkdir -p dist
          tar --extract --file atf-dist.tar --directory dist

      - name: Package the release
        run: packaging/release.sh --tag "${{ github.ref_name }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/release/*
